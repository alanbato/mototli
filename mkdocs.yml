site_name: Mototli
site_description: Modern Gopher protocol server and client implementation using asyncio
site_url: https://mototli.readthedocs.io
repo_url: https://github.com/alanbato/mototli
repo_name: alanbato/mototli
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.view
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Tutorials:
      - tutorials/index.md
      - Your First Gopherhole: tutorials/your-first-gopherhole.md
      - Building a Client: tutorials/building-a-client.md
      - Understanding Gopher+: tutorials/understanding-gopher-plus.md
  - How-to Guides:
      - how-to/index.md
      - Configure Server: how-to/configure-server.md
      - Setup CGI: how-to/setup-cgi.md
      - Directory Listings: how-to/directory-listings.md
      - Handle Binary Files: how-to/handle-binary-files.md
      - Fetch Resources: how-to/fetch-resources.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - Item Types: reference/item-types.md
      - API:
          - reference/api/index.md
          - Client: reference/api/client.md
          - Server: reference/api/server.md
          - Protocol: reference/api/protocol.md
  - Explanation:
      - explanation/index.md
      - Gopher Protocol: explanation/gopher-protocol.md
      - Gopher+ Extensions: explanation/gopher-plus.md
      - Architecture: explanation/architecture.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alanbato/mototli
  version:
    provider: mike
